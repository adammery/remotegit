[package]
name = "remotegit"
version = "0.5.4"
edition = "2021"
description = "GitHub Desktop-style Git client for repositories on SSH servers"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! embeds the plugin config as JSON.
serde_json = "1"

# Small, lean binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
