[package]
name = "remotegit"
version = "0.1.0"
edition = "2021"
description = "GitHub Desktop-style Git client for repositories on SSH servers"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

# Small, lean binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
