<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RemoteGit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button class="tb-btn tb-repo" id="tb-repo" type="button">
          <span class="tb-icon" data-icon="repo"></span>
          <span class="tb-text">
            <span class="tb-label">Current Repository</span>
            <span class="tb-value" id="tb-repo-name">None</span>
          </span>
          <span class="tb-caret" data-icon="caret"></span>
        </button>
        <button class="tb-btn tb-branch" id="tb-branch" type="button">
          <span class="tb-icon" data-icon="branch"></span>
          <span class="tb-text">
            <span class="tb-label">Current Branch</span>
            <span class="tb-value" id="tb-branch-name">—</span>
          </span>
          <span class="ci-badge" id="tb-ci" hidden></span>
          <span class="tb-caret" data-icon="caret"></span>
        </button>
        <button class="tb-btn tb-sync" id="tb-sync" type="button">
          <span class="tb-icon" id="sync-icon" data-icon="sync"></span>
          <span class="tb-text">
            <span class="tb-value" id="sync-title">Fetch origin</span>
            <span class="tb-label" id="sync-sub">Never fetched</span>
          </span>
          <span class="sync-counts" id="sync-counts"></span>
        </button>
        <button class="tb-btn tb-sync-more" id="tb-sync-more" type="button" title="Fetch, pull or push" disabled>
          <span class="tb-caret" data-icon="caret"></span>
        </button>
        <div class="tb-fill"></div>
        <button class="tb-btn tb-server" id="tb-server" type="button">
          <span class="tb-icon server-icon"><span data-icon="server"></span><span class="dot" id="server-dot" hidden></span></span>
          <span class="tb-text">
            <span class="tb-label">Server</span>
            <span class="tb-value" id="tb-server-name">All servers</span>
          </span>
          <span class="tb-caret" data-icon="caret"></span>
        </button>
        <button class="tb-btn tb-settings" id="tb-settings" type="button" title="Settings">
          <span class="tb-icon" data-icon="gear"></span>
        </button>
      </header>

      <div class="main">
        <aside class="sidebar" id="sidebar">
          <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="changes" type="button" role="tab">Changes <span class="tab-count" id="changes-count"></span></button>
            <button class="tab" data-tab="history" type="button" role="tab">History</button>
          </nav>

          <section class="pane" id="changes-pane">
            <div class="filter-row">
              <span class="filter-icon" data-icon="search"></span>
              <input id="filter" type="search" placeholder="Filter" spellcheck="false" autocomplete="off" />
            </div>
            <label class="files-header" id="files-header">
              <input type="checkbox" id="check-all" />
              <span id="files-count">0 changed files</span>
            </label>
            <div class="banner" id="state-banner" hidden></div>
            <div class="file-list" id="file-list" tabindex="0"></div>
            <div class="stash-row" id="stash-row" hidden></div>
            <form class="commit-box" id="commit-form" autocomplete="off">
              <div class="summary-row">
                <span class="avatar" id="avatar"></span>
                <input id="summary" placeholder="Summary (required)" spellcheck="true" />
              </div>
              <div class="desc-box">
                <textarea id="description" placeholder="Description" spellcheck="true"></textarea>
                <input id="coauthors" placeholder="@github-login or Name &lt;email&gt;, separated by commas" spellcheck="false" hidden />
                <div class="desc-tools">
                  <button class="btn-icon" id="coauthor-btn" type="button" title="Add co-authors" data-icon="personAdd"></button>
                  <button class="btn-icon" id="ai-btn" type="button" title="Write the message with AI (on the server)" data-icon="sparkle"></button>
                  <button class="btn-icon" id="commit-opts-btn" type="button" title="Commit options" data-icon="gear"></button>
                  <span class="desc-flags" id="commit-flags"></span>
                </div>
              </div>
              <button class="btn btn-primary btn-block" id="commit-btn" type="submit" disabled>Commit to <b>main</b></button>
              <div class="undo-bar" id="undo-bar" hidden></div>
            </form>
          </section>

          <section class="pane" id="history-pane" hidden>
            <div class="filter-row">
              <span class="filter-icon" data-icon="search"></span>
              <input id="history-filter" type="search" placeholder="Search commits, authors or a SHA" spellcheck="false" autocomplete="off" />
            </div>
            <div class="commit-list" id="commit-list" tabindex="0"></div>
          </section>
        </aside>
        <div class="resizer" id="resizer"></div>
        <div class="content-col">
          <main class="content" id="content"></main>
          <div class="update-bar" id="update-bar" hidden></div>
        </div>
      </div>
    </div>

    <div id="popover-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script src="vendor/highlight.min.js"></script>
    <script src="vendor/highlight-dockerfile.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
